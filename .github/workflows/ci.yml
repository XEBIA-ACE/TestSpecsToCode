name: CI

on:
  push:
    branches: [ main, flask-3-upgrade ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: "3.8"
      - name: Install pip 23.3.1
        run: |
          python -m pip install --upgrade pip==23.3.1
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8
      - name: Run flake8 linter
        run: flake8 .

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: "3.8"
      - name: Install pip 23.3.1
        run: |
          python -m pip install --upgrade pip==23.3.1
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run unit tests
        run: pytest

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: "3.8"
      - name: Install pip 23.3.1
        run: |
          python -m pip install --upgrade pip==23.3.1
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Build
        run: |
          echo "No explicit build step defined."

  sast:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() }}

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: "3.8"
      - name: Install pip 23.3.1
        run: |
          python -m pip install --upgrade pip==23.3.1
      - name: Install Bandit for SAST
        run: |
          pip install bandit
      - name: Run Bandit Security Scan
        run: |
          bandit -r app/ || true