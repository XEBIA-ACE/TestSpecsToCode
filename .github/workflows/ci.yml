name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 3.2.6
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 3.2.6
          cache: maven
      - name: Checkstyle Lint
        run: mvn --batch-mode checkstyle:check

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 3.2.6
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 3.2.6
          cache: maven
      - name: Run Unit Tests
        run: mvn --batch-mode test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 3.2.6
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 3.2.6
          cache: maven
      - name: Build with Maven
        run: mvn --batch-mode package -DskipTests

  sast:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 3.2.6
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 3.2.6
          cache: maven
      - name: Run SpotBugs SAST Scan
        run: mvn --batch-mode com.github.spotbugs:spotbugs-maven-plugin:4.7.3:check || true