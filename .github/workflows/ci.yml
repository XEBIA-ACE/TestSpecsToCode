name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 3.2.6
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '3.2.6'
      - name: Lint (Checkstyle)
        run: mvn checkstyle:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 3.2.6
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '3.2.6'
      - name: Test
        run: mvn test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 3.2.6
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '3.2.6'
      - name: Build with Maven
        run: mvn clean package

  sast:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 3.2.6
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '3.2.6'
      - name: Run SAST Scan (spotbugs)
        run: mvn com.github.spotbugs:spotbugs-maven-plugin:4.8.3:check --fail-at-end