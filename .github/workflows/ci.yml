name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 3.2.6
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '3.2.6'
      - name: Lint with Maven
        run: mvn --batch-mode clean verify -DskipTests

  test:
    name: Unit and Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 3.2.6
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '3.2.6'
      - name: Run test suite
        run: mvn --batch-mode test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 3.2.6
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '3.2.6'
      - name: Build with Maven
        run: mvn --batch-mode package

  sast:
    name: Static Application Security Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 3.2.6
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '3.2.6'
      - name: Run SAST with Maven
        run: mvn --batch-mode verify -DskipTests -Psecurity

  # Add additional jobs as-needed for deployment or notifications