# .github/workflows/deploy-production.yml
# CI/CD pipeline – User Management: Deploy to Production (US-001)
#
# Triggers:
#   - Manual dispatch (workflow_dispatch) for controlled production releases
#   - Push of a version tag (v*.*.*) from the main branch
#
# Zero-downtime guarantee:
#   The Kubernetes Deployment uses RollingUpdate with maxUnavailable=0 (see
#   deploy/kubernetes/deployment.yaml). This workflow gates on readiness probes
#   and a profile-feature smoke test before marking the deployment successful.

name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (e.g. v1.2.3 or a commit SHA)"
        required: true
        default: "latest"
  push:
    tags:
      - "v*.*.*"

env:
  IMAGE_REPO: xebia-ace/user-management
  NAMESPACE: production
  DEPLOYMENT: user-management

jobs:
  # ── 1. Build & push Docker image ──────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Determine image tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            # Strip leading 'v' from tag ref (refs/tags/v1.2.3 → 1.2.3)
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Run test suite (must pass before production deploy) ────────────────
  test:
    name: Run Tests (≥80% coverage)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests with coverage
        run: npm test -- --coverage --coverageThreshold='{"global":{"lines":80}}'

  # ── 3. Deploy to production ───────────────────────────────────────────────
  deploy:
    name: Deploy to Production (Zero Downtime)
    runs-on: ubuntu-latest
    needs: [build, test]
    environment:
      name: production
      url: https://user-management.example.com
    concurrency:
      group: production-deploy
      cancel-in-progress: false   # never cancel an in-flight production deploy
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Set kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connectivity
        run: kubectl cluster-info

      - name: Make deploy script executable
        run: chmod +x deploy/deploy-production.sh

      - name: Deploy to production
        run: ./deploy/deploy-production.sh "${{ needs.build.outputs.image_tag }}"
        env:
          # Passed through to the script for any curl-based smoke tests
          SMOKE_TEST_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}

      - name: Verify profile feature is functional
        run: |
          # Additional end-to-end check: profile view endpoint returns 200
          INGRESS_URL="https://user-management.example.com"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.SMOKE_TEST_TOKEN }}" \
            "${INGRESS_URL}/api/v1/profile/health")
          echo "Profile health endpoint returned HTTP ${HTTP_STATUS}"
          [[ "${HTTP_STATUS}" == "200" ]] || exit 1

      - name: Notify on success
        if: success()
        run: |
          echo "::notice title=Deployment Successful::User Management ${{ needs.build.outputs.image_tag }} deployed to production. Profile view/edit (US-001) is live."

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error title=Deployment Failed::Production deployment of ${{ needs.build.outputs.image_tag }} failed. Check logs and rollback status."
